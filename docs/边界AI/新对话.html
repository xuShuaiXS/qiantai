<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>极光AI - 智能AI对话、写作与画图生成工具的领先方案</title>
  <link rel="icon" type="image/png" href="//img.alicdn.com/imgextra/i2/1818153824/O1CN01thpPgF1e7RfDsfJpf_!!1818153824.png" />
  <link href="https://cdn.ai1foo.com/remixicon.css" rel="stylesheet" />
  <style>
    /* 字体：与原站一致（阿里普惠体 + Plus Jakarta Sans） */
    @font-face {
      font-family: "AlibabaPuHuiTi";
      src: url("https://cdn.ai1foo.com/fonts/alibaba/AlibabaPuHuiTi-3-55-Regular.woff2") format("woff2");
      font-weight: 400; font-display: swap;
    }
    @font-face {
      font-family: "AlibabaPuHuiTi";
      src: url("https://cdn.ai1foo.com/fonts/alibaba/AlibabaPuHuiTi-3-95-ExtraBold.woff2") format("woff2");
      font-weight: 700; font-display: swap;
    }
    @font-face {
      font-family: "AlibabaPuHuiTi";
      src: url("https://cdn.ai1foo.com/fonts/alibaba/AlibabaPuHuiTi-3-45-Light.woff2") format("woff2");
      font-weight: 300; font-display: swap;
    }

    :root {
      --blue: #1677ff;
      --blue-hover: #4096ff;
      --blue-bg: #e6f4ff;
      --blue-bg-2: #bae0ff;
      --ink: #262626;
      --ink-2: #595959;
      --ink-3: #8c8c8c;
      --line: #f0f0f0;
      --line-2: #d9d9d9;
      --page: #f7f8fa;
      --sider-w: 220px;
      --sider-bg: rgb(17, 20, 45);
      --sider-text: rgba(255, 255, 255, 0.92);
      --sider-muted: rgba(255, 255, 255, 0.45);
      --sider-active: #3b9eff;
      --nav-h: 56px;
      --promo-h: 48px;
      --font: "AlibabaPuHuiTi", "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: var(--font);
      color: var(--ink);
      background: var(--page);
      overflow: hidden;
      font-size: 14px;
      -webkit-font-smoothing: antialiased;
    }
    button, input, textarea { font-family: inherit; }
    button { cursor: pointer; border: none; background: none; color: inherit; }
    a { color: inherit; text-decoration: none; }
    ul { list-style: none; }
    img { display: block; max-width: 100%; }

    .app { display: flex; flex-direction: column; height: 100vh; width: 100%; }

    /* ── 顶部图片占位 ───────────────────────────── */
    .top-banner {
      height: var(--promo-h);
      flex-shrink: 0;
      position: relative;
      z-index: 30;
      overflow: hidden;
      background: linear-gradient(90deg, #0b1228 0%, #152046 40%, #1a3a5c 70%, #0e1a36 100%);
    }
    .top-banner img {
      width: 100%; height: 100%; object-fit: cover; object-position: center;
    }
    .top-banner .banner-placeholder {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      gap: 10px; color: rgba(255,255,255,.85); font-size: 13px;
      background:
        radial-gradient(ellipse 60% 120% at 20% 50%, rgba(0,200,180,.18), transparent 55%),
        radial-gradient(ellipse 50% 100% at 80% 50%, rgba(59,158,255,.2), transparent 50%),
        linear-gradient(90deg, #0b1228 0%, #152046 40%, #1a3a5c 70%, #0e1a36 100%);
    }
    .top-banner .banner-placeholder strong { color: #7ee8d4; font-weight: 700; }
    .banner-close {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      width: 24px; height: 24px; border-radius: 6px; color: rgba(255,255,255,.85);
      display: inline-flex; align-items: center; justify-content: center; font-size: 16px;
      z-index: 2;
    }
    .banner-close:hover { background: rgba(255,255,255,.18); }
    .app.banner-hidden .top-banner { display: none; }

    .shell { flex: 1; min-height: 0; display: flex; }

    /* ── 左侧导航（深色） ─────────────────────── */
    .sider {
      width: var(--sider-w);
      flex-shrink: 0;
      background: var(--sider-bg);
      display: flex;
      flex-direction: column;
      border-right: none;
      transition: width .18s ease;
      position: relative;
      z-index: 12;
      color: var(--sider-text);
      overflow: visible;
    }
    .sider-head {
      height: 64px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse 80% 90% at 15% 30%, rgba(0, 220, 200, .22), transparent 55%),
        radial-gradient(ellipse 60% 80% at 70% 20%, rgba(59, 158, 255, .15), transparent 50%),
        linear-gradient(180deg, rgba(20, 40, 70, .9) 0%, transparent 100%);
    }
    .sider-head::before {
      content: "";
      position: absolute; inset: 0;
      background-image:
        linear-gradient(115deg, transparent 40%, rgba(0,220,200,.06) 50%, transparent 60%),
        repeating-linear-gradient(90deg, transparent, transparent 18px, rgba(0,200,180,.04) 18px, rgba(0,200,180,.04) 19px);
      pointer-events: none;
    }
    .sider-head img.logo {
      width: 28px; height: 28px; border-radius: 6px; position: relative; z-index: 1;
      box-shadow: 0 0 12px rgba(0, 220, 200, .35);
    }
    .sider-head .name {
      font-size: 15px; font-weight: 700; letter-spacing: .3px;
      color: #fff; position: relative; z-index: 1; white-space: nowrap;
    }
    .sider-head .name em {
      font-style: normal; font-weight: 600; margin-left: 2px;
      background: linear-gradient(90deg, #7ee8d4, #5aadff);
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
    }

    /* 收起按钮：贴在侧栏右边缘中部 */
    .sider-collapse {
      position: absolute; right: -12px; top: 50%; transform: translateY(-50%);
      width: 12px; height: 48px; border-radius: 0 8px 8px 0;
      background: #2a2f4a; color: rgba(255,255,255,.65);
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px; z-index: 25; box-shadow: 1px 0 4px rgba(0,0,0,.2);
      padding: 0;
    }
    .sider-collapse:hover { background: #3a4060; color: #fff; }
    .sider.collapsed .sider-collapse i { transform: rotate(180deg); }

    /* 收起态：仅保留图标 */
    .sider.collapsed { width: 64px; }
    .sider.collapsed .sider-head { padding: 0; justify-content: center; }
    .sider.collapsed .sider-head .name { display: none; }
    .sider.collapsed .sider-scroll { padding: 6px 8px 20px; }
    .sider.collapsed .nav-group-title { font-size: 0; height: 12px; padding: 0; overflow: hidden; }
    .sider.collapsed .nav-item { justify-content: center; padding: 0 6px; gap: 0; }
    .sider.collapsed .nav-item .txt,
    .sider.collapsed .nav-item .tag,
    .sider.collapsed .nav-item .dot-new { display: none; }

    .sider-scroll {
      flex: 1; min-height: 0; overflow-y: auto;
      padding: 4px 10px 24px;
      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.15) transparent;
    }
    .sider-scroll::-webkit-scrollbar { width: 3px; }
    .sider-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,.15); border-radius: 4px; }
    .sider-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,.25); }

    .nav-group { margin-top: 8px; }
    .nav-group:first-child { margin-top: 2px; }
    .nav-group-title {
      display: flex; align-items: center;
      padding: 8px 10px 4px;
      font-size: 12px; color: var(--sider-muted);
      user-select: none; font-weight: 400;
    }

    .nav-item {
      display: flex; align-items: center; gap: 10px;
      height: 40px; padding: 0 10px; border-radius: 8px;
      font-size: 14px; color: var(--sider-text);
      margin-bottom: 2px; white-space: nowrap;
      border: 1px solid transparent;
      transition: background .15s, color .15s, border-color .15s;
      cursor: pointer;
    }
    .nav-item .ico {
      width: 20px; height: 20px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 4px; overflow: hidden; font-size: 18px; color: inherit;
    }
    .nav-item .ico img { width: 100%; height: 100%; object-fit: contain; }
    .nav-item .ico i { font-size: 18px; line-height: 1; }
    .nav-item:hover { background: rgba(255,255,255,.06); }
    .nav-item.active {
      background: rgba(59, 158, 255, .12);
      border-color: rgba(59, 158, 255, .55);
      color: var(--sider-active);
      font-weight: 500;
      box-shadow: 0 0 0 1px rgba(59, 158, 255, .08);
    }
    .nav-item.active .ico { color: var(--sider-active); }
    .nav-item .txt {
      overflow: hidden; text-overflow: ellipsis;
      position: relative; display: inline-flex; align-items: center;
    }
    .nav-item .dot-new {
      width: 6px; height: 6px; border-radius: 50%;
      background: #ff4d4f; flex-shrink: 0;
      margin-left: 4px; margin-top: -8px;
    }

    .tag {
      margin-left: auto; flex-shrink: 0;
      font-size: 10px; line-height: 16px; height: 16px;
      padding: 0 5px; border-radius: 4px; font-weight: 400;
      background: rgba(255,255,255,.08); color: rgba(255,255,255,.45);
    }
    .tag-new { background: rgba(255,77,79,.15); color: #ff7875; }
    .tag-num { background: rgba(255,255,255,.08); color: rgba(255,255,255,.45); }
    .tag-hot { background: rgba(250,140,22,.15); color: #ffc069; }
    .nav-item.active .tag { background: rgba(255,255,255,.08); color: rgba(255,255,255,.45); }

    /* 未实现功能弹窗 */
    .toast-mask {
      display: none; position: fixed; inset: 0; z-index: 100;
      background: rgba(0,0,0,.45);
      align-items: center; justify-content: center;
    }
    .toast-mask.show { display: flex; }
    .toast-box {
      width: 320px; max-width: calc(100vw - 40px);
      background: #fff; border-radius: 12px;
      box-shadow: 0 12px 40px rgba(0,0,0,.2);
      padding: 28px 24px 20px; text-align: center;
    }
    .toast-box .toast-ico {
      width: 48px; height: 48px; margin: 0 auto 14px;
      border-radius: 12px; background: #e6f4ff; color: var(--blue);
      display: flex; align-items: center; justify-content: center; font-size: 24px;
    }
    .toast-box h3 { font-size: 16px; font-weight: 600; color: var(--ink); margin-bottom: 8px; }
    .toast-box p { font-size: 13px; color: var(--ink-3); line-height: 1.6; margin-bottom: 18px; }
    .toast-box .toast-ok {
      width: 100%; height: 36px; border-radius: 8px;
      background: var(--blue); color: #fff; font-size: 14px; font-weight: 500;
    }
    .toast-box .toast-ok:hover { background: var(--blue-hover); }

    /* ── 主区域 ───────────────────────────────── */
    .main {
      flex: 1; min-width: 0; display: flex; flex-direction: column;
      background: #fff; position: relative;
    }

    .topbar {
      height: var(--nav-h);
      flex-shrink: 0;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: #fff;
      position: relative;
      z-index: 20;
    }
    .btn-new {
      display: inline-flex; align-items: center; gap: 6px;
      height: 34px; padding: 0 12px; border-radius: 8px;
      border: 1px solid var(--line-2); background: #fff;
      font-size: 13px; color: var(--ink-2); flex-shrink: 0;
    }
    .btn-new:hover { border-color: var(--blue); color: var(--blue); }
    .btn-new i { font-size: 15px; }

    .model-picker {
      position: relative; flex-shrink: 0;
    }
    .model-picker > button {
      display: inline-flex; align-items: center; gap: 8px;
      min-height: 40px; padding: 4px 10px; border-radius: 10px;
      font-size: 14px; font-weight: 500; color: var(--ink);
      max-width: 340px; text-align: left;
    }
    .model-picker > button:hover { background: #f5f5f5; }
    .model-picker img.mi { width: 22px; height: 22px; border-radius: 5px; flex-shrink: 0; }
    .model-picker .mmeta { min-width: 0; display: flex; flex-direction: column; gap: 1px; }
    .model-picker .mname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.25; }
    .model-picker .mtip {
      font-size: 11px; font-weight: 400; color: var(--ink-3); line-height: 1.2;
      white-space: nowrap;
    }
    .model-picker .chev { color: var(--ink-3); font-size: 16px; flex-shrink: 0; }

    .switch-mode {
      display: inline-flex; align-items: center; gap: 2px;
      padding: 3px; border-radius: 8px; background: #f5f5f5;
      flex-shrink: 0;
    }
    .switch-mode button {
      height: 28px; padding: 0 14px; border-radius: 6px;
      font-size: 13px; color: var(--ink-2);
      transition: background .15s, color .15s;
    }
    .switch-mode button:hover { color: var(--blue); }
    .switch-mode button.active {
      background: #fff; color: var(--blue); font-weight: 500;
      box-shadow: 0 1px 2px rgba(0,0,0,.08);
    }

    .top-right { display: flex; align-items: center; gap: 6px; margin-left: auto; flex-shrink: 0; }
    .icon-btn {
      width: 34px; height: 34px; border-radius: 8px; color: var(--ink-2);
      display: inline-flex; align-items: center; justify-content: center; font-size: 17px;
      position: relative;
    }
    .icon-btn:hover { background: #f5f5f5; color: var(--ink); }
    .icon-btn .dot {
      position: absolute; top: 7px; right: 7px;
      width: 6px; height: 6px; border-radius: 50%; background: #ff4d4f;
      border: 1px solid #fff;
    }
    .user-entry {
      display: inline-flex; align-items: center; gap: 8px;
      height: 36px; padding: 0 12px 0 4px; border-radius: 999px; margin-left: 2px;
    }
    .user-entry:hover { background: #f5f5f5; }
    .user-entry .av {
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(135deg, #69b1ff, var(--blue));
      color: #fff; font-size: 12px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .user-entry .uname { font-size: 13px; color: var(--ink-2); }
    .vip-pill {
      display: inline-flex; align-items: center; gap: 3px;
      height: 22px; padding: 0 8px; border-radius: 999px;
      background: linear-gradient(90deg,#ffe58f,#ffd666);
      color: #873800; font-size: 12px; font-weight: 600;
    }

    /* 下拉面板：模型选择（对齐截图） */
    .panel {
      display: none; position: absolute; top: 48px; left: 0;
      width: 520px; max-height: 520px; overflow: hidden;
      background: #fff; border: 1px solid #ebebeb;
      border-radius: 14px; box-shadow: 0 12px 40px rgba(15, 23, 42, .14);
      z-index: 60; text-align: left;
      flex-direction: column;
    }
    .panel.open { display: flex; }
    .panel-head {
      padding: 14px 14px 0; flex-shrink: 0;
    }
    .panel-head-row {
      display: flex; align-items: center; gap: 10px; margin-bottom: 12px;
    }
    .panel-title {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 15px; font-weight: 600; color: var(--ink); flex-shrink: 0;
    }
    .panel-title .gear {
      width: 22px; height: 22px; border-radius: 6px; color: var(--ink-3);
      display: inline-flex; align-items: center; justify-content: center; font-size: 15px;
    }
    .panel-title .gear:hover { background: #f5f5f5; color: var(--ink); }
    .panel-search {
      flex: 1; display: flex; align-items: center; gap: 8px;
      height: 34px; padding: 0 12px; border-radius: 8px;
      background: #f5f5f5; color: var(--ink-3); min-width: 0;
    }
    .panel-search input {
      flex: 1; border: none; outline: none; background: transparent;
      font-size: 13px; color: var(--ink); min-width: 0;
    }
    .panel-tabs {
      display: flex; align-items: center; gap: 4px;
      overflow-x: auto; padding-bottom: 0;
      scrollbar-width: none; border-bottom: 1px solid #f0f0f0;
      margin: 0 -2px;
    }
    .panel-tabs::-webkit-scrollbar { display: none; }
    .panel-tab {
      flex-shrink: 0; height: 36px; padding: 0 12px;
      font-size: 13px; color: var(--ink-2); position: relative;
      white-space: nowrap; transition: color .15s;
    }
    .panel-tab:hover { color: var(--blue); }
    .panel-tab.active {
      color: var(--blue); font-weight: 600;
    }
    .panel-tab.active::after {
      content: ""; position: absolute; left: 12px; right: 12px; bottom: 0;
      height: 2px; border-radius: 2px 2px 0 0; background: var(--blue);
    }
    .panel-body {
      flex: 1; min-height: 0; overflow-y: auto; padding: 8px 8px 10px;
      scrollbar-width: thin; scrollbar-color: #e0e0e0 transparent;
    }
    .panel-body::-webkit-scrollbar { width: 5px; }
    .panel-body::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 4px; }
    .model-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 10px; border-radius: 10px; cursor: pointer;
      transition: background .15s;
    }
    .model-item:hover { background: #f7f8fa; }
    .model-item.active { background: #eef5ff; }
    .model-item .mi-rank {
      width: 18px; flex-shrink: 0; text-align: center;
      font-size: 12px; color: #bfbfbf; font-weight: 500;
    }
    .model-item .mi-letter {
      width: 32px; height: 32px; border-radius: 8px; flex-shrink: 0;
      display: inline-flex; align-items: center; justify-content: center;
      color: #fff; font-size: 14px; font-weight: 700;
    }
    .model-item .mi-body { min-width: 0; flex: 1; }
    .model-item .mi-title {
      font-size: 14px; font-weight: 600; color: var(--ink);
      display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
      line-height: 1.3;
    }
    .model-item .mi-desc {
      margin-top: 3px; font-size: 12px; color: var(--ink-3); line-height: 1.45;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .model-item .mi-check {
      flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%;
      display: none; align-items: center; justify-content: center;
      color: var(--blue); font-size: 18px;
    }
    .model-item.active .mi-check { display: inline-flex; }
    .chip {
      font-size: 10px; line-height: 16px; height: 16px; padding: 0 5px;
      border-radius: 4px; font-weight: 500; white-space: nowrap;
    }
    .chip-free { background: #f6ffed; color: #52c41a; }
    .chip-think { background: #f9f0ff; color: #722ed1; }
    .chip-new { background: #fff1f0; color: #f5222d; }
    .chip-cost {
      min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
      background: #f3e8ff; color: #7c3aed; font-size: 11px; font-weight: 600;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .chip-hot { background: #fff7e6; color: #d48806; }

    /* ── 工作区 ───────────────────────────────── */
    .workspace { flex: 1; min-height: 0; overflow-y: auto; position: relative; }
    .workspace::-webkit-scrollbar { width: 6px; }
    .workspace::-webkit-scrollbar-thumb { background: #e0e0e0; border-radius: 6px; }

    .ws-inner {
      max-width: 1440px; margin: 0 auto;
      padding: 26px 24px 0;
    }
    .welcome {
      max-width: 800px; width: 100%; margin: 0 auto;
      display: flex; flex-direction: column; gap: 24px;
      padding-bottom: 60px;
    }

    .hero {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 24px;
      padding: 28px 4px 10px;
      min-height: 110px;
    }
    .hero-greet {
      flex: 1; min-width: 0;
      text-align: left;
      padding-bottom: 4px;
    }
    .hero-greet .greet {
      display: block;
      font-size: 28px; font-weight: 700; color: var(--ink);
      line-height: 1.35; letter-spacing: .02em;
    }
    .hero-greet .type-line {
      margin-top: 6px;
      font-size: 22px; font-weight: 600; color: var(--ink);
      line-height: 1.45; min-height: 1.45em;
      display: flex; align-items: center; flex-wrap: wrap;
    }
    .hero-greet .type-text { white-space: pre-wrap; }
    .hero-greet .type-caret {
      display: inline-block; width: 2px; height: 1.05em;
      margin-left: 2px; background: var(--ink);
      vertical-align: -2px;
      animation: blink 1s step-end infinite;
      flex-shrink: 0;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* 右侧轮播：可见4项；第3项白胶囊最靠左；1/2/4无底偏右；图标与第3项同列 */
    .series-carousel {
      --series-indent: 12px;
      position: relative;
      width: 200px;
      height: 168px;
      flex-shrink: 0;
      overflow: hidden;
      mask-image: linear-gradient(to bottom, transparent 0%, #000 10%, #000 90%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 10%, #000 90%, transparent 100%);
    }
    .series-track {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      will-change: transform;
      transition: transform .65s cubic-bezier(.25, .8, .25, 1);
    }
    .series-item {
      display: flex;
      align-items: center;
      box-sizing: border-box;
      height: 42px;
      margin: 0;
      padding-left: var(--series-indent);
      border: none;
      background: transparent;
      opacity: .55;
      transition: padding-left .45s cubic-bezier(.25, .8, .25, 1), opacity .35s ease;
      pointer-events: none;
      user-select: none;

      display: inline-flex;
      align-items: center;
      gap: 8px;
      height: 34px;
      padding: 0;
      border: none;
      border-radius: 999px;
      background: transparent;
      box-shadow: none;
      white-space: nowrap;
      color: #9aa1ac;
      font-size: 13px;
      font-weight: 500;

      height: 18px;

      font-weight: 700;

      border: none;

      color: #262626;
      font-weight: 600;

    .series-item.pos-active .si-badge { opacity: 1; }

    /* 输入框 */
    .composer {
      border: 1px solid var(--line-2); border-radius: 16px; background: #fff;
      padding: 10px 12px 8px;
      transition: border-color .15s, box-shadow .15s;
      position: relative;

      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(22,119,255,.08);
    }
    .composer textarea {
      width: 100%; border: none; outline: none; resize: none;
      font-size: 15px; line-height: 1.6; min-height: 52px; max-height: 180px;
      color: var(--ink); background: transparent; display: block;
    }
    .composer textarea::placeholder { color: #bfbfbf; }
    .composer-bar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-top: 6px;
    }
    .bar-left, .bar-right { display: flex; align-items: center; gap: 4px; }
    .tool-btn {
      height: 30px; padding: 0 9px; border-radius: 8px; font-size: 13px;
      color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px;
      transition: background .15s, color .15s;
    }
    .tool-btn i { font-size: 16px; color: var(--ink-3); }
    .tool-btn img { width: 15px; height: 15px; object-fit: contain; }
    .tool-btn:hover { background: #f5f5f5; color: var(--ink); }
    .tool-btn.on { background: var(--blue-bg); color: var(--blue); }
    .tool-btn.on i { color: var(--blue); }

    .send-btn {
      width: 34px; height: 34px; border-radius: 50%;
      background: #f0f0f0; color: #bfbfbf;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 18px; transition: background .15s;
    }
    .send-btn.ready { background: var(--blue); color: #fff; }
    .send-btn.ready:hover { background: var(--blue-hover); }
    .send-btn:disabled { cursor: not-allowed; }

    /* 快捷入口 chips */
    .quick-row {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
      gap: 12px; position: relative;
    }
    .quick-chip {
      display: inline-flex; align-items: center; gap: 8px;
      height: 38px; padding: 0 14px; border-radius: 999px;
      border: 1px solid var(--line-2); background: #fff;
      font-size: 14px; color: var(--ink-2);
      transition: border-color .15s, color .15s, background .15s;
    }
    .quick-chip img { width: 18px; height: 18px; object-fit: contain; }
    .quick-chip:hover { border-color: var(--blue); color: var(--blue); background: #f0f7ff; }
    .quick-chip.on { border-color: var(--blue); color: var(--blue); background: var(--blue-bg); }
    .quick-more {
      display: inline-flex; align-items: center; gap: 4px;
      height: 38px; padding: 0 12px; border-radius: 999px;
      font-size: 14px; color: var(--ink-3);
    }
    .quick-more:hover { background: #f5f5f5; color: var(--ink); }
    .quick-pop {
      display: none; position: absolute; top: 46px; left: 50%; transform: translateX(-50%);
      background: #fff; border: 1px solid var(--line); border-radius: 12px;
      box-shadow: 0 8px 28px rgba(0,0,0,.12); padding: 8px; z-index: 50;
      gap: 8px; flex-wrap: wrap; max-width: 620px; justify-content: center;
    }
    .quick-pop.open { display: flex; }

    /* ── 通用 section ─────────────────────────── */
    .section-title {
      font-size: 14px; color: var(--ink-2);
      margin-bottom: 10px;
    }
    .section-title.mt { margin-top: 22px; }
    .section-hd {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px;
    }
    .section-hd .section-title { margin-bottom: 0; }
    .more-link {
      font-size: 13px; color: var(--ink-3);
      display: inline-flex; align-items: center; gap: 4px;
    }
    .more-link:hover { color: var(--blue); }

    .prompt-grid {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px;
    }
    .prompt-card {
      text-align: left; position: relative;
      padding: 12px 12px 32px; border-radius: 8px;
      border: 1px solid #f5f5f5; background: #fff;
      transition: border-color .15s, box-shadow .15s;
      min-height: 96px; overflow: hidden;
    }
    .prompt-card:hover {
      border-color: var(--blue);
      box-shadow: 0 2px 12px rgba(22,119,255,.08);
    }
    .prompt-card .pt {
      font-size: 14px; color: var(--ink-2); line-height: 1.6;
      display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    }
    .prompt-card .corner {
      position: absolute; right: 12px; bottom: 12px;
      width: 8px; height: 8px; opacity: .3;
    }

    .chart-grid {
      display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 16px;
    }
    .chart-item {
      display: flex; flex-direction: column; gap: 4px; cursor: pointer;
    }
    .chart-thumb {
      border-radius: 8px; overflow: hidden;
      border: 2px solid #f5f5f5; background: #fafafa;
      aspect-ratio: 1.28; display: flex; align-items: center; justify-content: center;
      transition: border-color .15s;
    }
    .chart-item:hover .chart-thumb { border-color: var(--blue); }
    .chart-thumb img { width: 86%; height: 86%; object-fit: contain; }
    .chart-item span {
      font-size: 12px; color: var(--ink-2); text-align: center; line-height: 1.4;
    }

    /* ── 对话消息 ─────────────────────────────── */
    .msgs { display: none; max-width: 800px; margin: 0 auto; padding: 8px 0 220px; }
    .msgs.show { display: block; }
    .msg { display: flex; gap: 12px; margin-bottom: 24px; }
    .msg .m-avatar {
      width: 30px; height: 30px; border-radius: 8px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; background: #f5f5f5; color: var(--ink-3); font-size: 16px;
    }
    .msg.assistant .m-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .msg .m-body { flex: 1; min-width: 0; padding-top: 3px; }
    .msg .m-role { font-size: 12px; color: var(--ink-3); margin-bottom: 6px; }
    .msg .m-content {
      font-size: 15px; line-height: 1.75; color: var(--ink);
      white-space: pre-wrap; word-break: break-word;
    }
    .cursor {
      display: inline-block; width: 2px; height: 15px; background: var(--blue);
      margin-left: 2px; vertical-align: -2px; animation: blink 1s step-end infinite;
    }

    /* 对话态：输入框吸底 */
    .composer-dock {
      display: none; position: absolute; left: 0; right: 0; bottom: 0;
      padding: 10px 24px 18px;
      background: linear-gradient(to top, #fff 62%, rgba(255,255,255,0));
      z-index: 15;
    }
    .composer-dock.show { display: block; }
    .composer-dock .composer { max-width: 800px; margin: 0 auto; }
    .dock-tip {
      max-width: 800px; margin: 6px auto 0;
      font-size: 12px; color: #bfbfbf; text-align: center;
    }

    /* 移动端 */
    .mobile-bar {
      display: none; height: var(--nav-h); align-items: center; gap: 8px;
      padding: 0 10px; border-bottom: 1px solid var(--line); background: #fff;
      flex-shrink: 0;
    }
    .mobile-bar .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; }
    .mobile-bar .brand img { width: 26px; height: 26px; border-radius: 6px; }
    .mask { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 40; }
    .mask.show { display: block; }

    @media (max-width: 1280px) {
      .prompt-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .chart-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (max-width: 900px) {
      .sider {
        position: fixed; inset: 0 auto 0 0; z-index: 50; height: 100vh;
        transform: translateX(-100%); transition: transform .22s ease; width: 244px;
      }
      .sider.open { transform: translateX(0); }
      .mobile-bar { display: flex; }
      .topbar { display: none; }
      .prompt-grid { grid-template-columns: 1fr; }
      .chart-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .hero { min-height: 96px; padding: 18px 0 8px; gap: 12px; }
      .hero-greet .greet { font-size: 22px; }
      .hero-greet .type-line { font-size: 17px; }
      .series-carousel { --series-indent: 10px; width: 168px; height: 152px; }
      .series-item { height: 38px; }
      .series-item .si-pill { height: 30px; font-size: 12px; }
      .series-item.pos-active .si-pill { padding: 0 14px 0 var(--series-indent); }
      .panel { width: min(520px, calc(100vw - 32px)); left: 0; }
      .ws-inner { padding: 18px 14px 0; }
      .composer-dock { padding: 10px 14px 14px; }
      .model-picker .mtip { display: none; }
    }
  </style>
</head>

      function renderNav() {

            html += '<div class="nav-group-title">' + sec.title + "</div>";

            var tag = it.tag
              ? '<span class="tag ' + (it.tagCls || "tag-num") + '">' + it.tag + "</span>"
              : "";
            var dot = it.dot ? '<span class="dot-new"></span>' : "";
            var src = it.icon || it.img;

            html +=
              '<a class="nav-item' + (it.active ? " active" : "") + '" href="javascript:;"' +
              ' data-key="' + (it.key || "") + '"' +
              ' data-page="' + (it.page ? "1" : "0") + '"' +
              ' data-name="' + it.name + '">' +
              ico +
              '<span class="txt">' + it.name + dot + "</span>" +
              tag +
              "</a>";
          });
          html += "</div>";
        });
        $("sideNav").innerHTML = html;

        $("sideNav").onclick = function (e) {
          var item = e.target.closest(".nav-item");
          if (!item) return;
          e.preventDefault();
          if (item.getAttribute("data-page") === "1") {
            var nodes = $("sideNav").querySelectorAll(".nav-item");
            for (var i = 0; i < nodes.length; i++) nodes[i].classList.remove("active");

            return;

        var ITEM_H = 42;
        var PAD = 3;
        var focusSlot = 2; /* 第 3 项 */
        var list = rollSeries.slice();
        var loop = list.slice(-PAD).concat(list).concat(list.slice(0, PAD));

        loop.forEach(function (s) {
          var el = document.createElement("div");
          el.className = "series-item";
          el.innerHTML =
            '<div class="si-pill">' +
              '<span class="si-badge" style="background:' + s.color + '">' + s.letter + "</span>" +
              '<span class="si-name">' + s.name + "</span>" +
            "</div>";
          track.appendChild(el);
        });

        var items = track.querySelectorAll(".series-item");
        var idx = PAD;
        var jumping = false;

        function paint() {
          track.style.transform = "translateY(" + (-(idx - focusSlot) * ITEM_H) + "px)";
          for (var i = 0; i < items.length; i++) {
            var el = items[i];
            el.classList.remove("pos-active", "pos-near");
            var dist = Math.abs(i - idx);
            if (dist === 0) el.classList.add("pos-active");
            else if (dist <= 2) el.classList.add("pos-near");
          }
        }

        paint();

        setInterval(function () {
          if (jumping) return;
          idx++;
          track.style.transition = "transform .65s cubic-bezier(.25, .8, .25, 1)";
          paint();
          if (idx >= list.length + PAD) {
            jumping = true;
            setTimeout(function () {
              track.style.transition = "none";
              idx = PAD;
              paint();
              void track.offsetHeight;
              track.style.transition = "transform .65s cubic-bezier(.25, .8, .25, 1)";
              jumping = false;
            }, 680);
          }
        }, 2000);
      })();

      /* ── 打招呼：逐字打出 → 停顿 → 逐字回删 → 下一条 ── */
      function runTypewriter() {
        var el = $("typeText");
        if (typeTimer) clearTimeout(typeTimer);

        /* 按 Unicode 码点切分，避免 emoji 被拆坏 */
        var chars = Array.from(typeLines[typeIdx % typeLines.length]);
        var i = 0;
        var phase = "type"; /* type | hold | erase */

        function paint() {
          el.textContent = chars.slice(0, i).join("");
        }

        function tick() {
          if (phase === "type") {
            i++;
            paint();
            if (i >= chars.length) {
              phase = "hold";
              typeTimer = setTimeout(tick, 1800);
              return;
            }
            typeTimer = setTimeout(tick, 68);
            return;
          }
          if (phase === "hold") {
            phase = "erase";
            typeTimer = setTimeout(tick, 40);
            return;
          }
          /* erase：从末尾一个字一个字消失 */
          i--;
          paint();
          if (i <= 0) {
            typeIdx++;
            typeTimer = setTimeout(runTypewriter, 320);
            return;
          }
          typeTimer = setTimeout(tick, 36);
        }

        el.textContent = "";
        typeTimer = setTimeout(tick, 200);
      }
      runTypewriter();

      /* ── 模型下拉（标题 + 搜索 + 分类 Tab + 编号列表）── */
      function tabCount(key) {
        if (key === "all") return models.length;
        if (key === "hot") return models.filter(function (m) { return m.hot; }).length;
        return models.filter(function (m) { return m.series === key; }).length;
      }

      function renderTabs() {
        var tabs = $("modelTabs");
        if (!tabs) return;
        tabs.innerHTML = modelTabs.map(function (t) {
          return '<button class="panel-tab' + (t.key === activeTab ? " active" : "") +
            '" type="button" data-tab="' + t.key + '">' +
            t.label + " (" + tabCount(t.key) + ")</button>";
        }).join("");
      }

      function filteredModels(filter) {
        var q = (filter || "").trim().toLowerCase();
        return models.filter(function (m) {
          if (activeTab === "hot" && !m.hot) return false;
          if (activeTab !== "all" && activeTab !== "hot" && m.series !== activeTab) return false;
          if (!q) return true;
          return m.label.toLowerCase().indexOf(q) > -1 || m.desc.indexOf(q) > -1;
        });
      }

      function renderModels(filter) {
        var list = filteredModels(filter);
        modelList.innerHTML = "";
        list.forEach(function (m, i) {
          var badges = "";
          if (m.cost != null) badges += '<span class="chip-cost">' + m.cost + "</span>";
          if (m.free) badges += '<span class="chip chip-free">限时免费</span>';
          if (m.hot && activeTab !== "hot") badges += '<span class="chip chip-hot">热门</span>';

          var el = document.createElement("div");
          el.className = "model-item" + (m.key === currentModel.key ? " active" : "");
          el.innerHTML =
            '<span class="mi-rank">' + (i + 1) + "</span>" +
            '<span class="mi-letter" style="background:' + m.color + '">' + m.letter + "</span>" +
            '<div class="mi-body">' +
              '<div class="mi-title">' + m.label + badges + "</div>" +
              '<div class="mi-desc">' + m.desc + "</div>" +
            "</div>" +
            '<i class="ri-check-line mi-check"></i>';
          el.addEventListener("click", function (e) {
            e.stopPropagation();
            selectModel(m);
          });
          modelList.appendChild(el);
        });
      }

      function selectModel(m) {
        currentModel = m;
        $("curModelName").textContent = m.label;
        $("curModelIcon").src = m.icon;
        input.placeholder = "给 " + m.label + " 发消息";
        modelPanel.classList.remove("open");
        renderModels($("modelSearch").value);
      }

      $("btnModel").addEventListener("click", function (e) {
        e.stopPropagation();
        modelPanel.classList.toggle("open");
      });
      $("modelSearch").addEventListener("input", function (e) {
        renderModels(e.target.value);
      });
      $("modelTabs").addEventListener("click", function (e) {
        var btn = e.target.closest(".panel-tab");
        if (!btn) return;
        e.stopPropagation();
        activeTab = btn.getAttribute("data-tab");
        renderTabs();
        renderModels($("modelSearch").value);
      });
      var btnSetting = $("btnModelSetting");
      if (btnSetting) {
        btnSetting.addEventListener("click", function (e) {
          e.stopPropagation();
          showToast("模型设置");
        });
      }
      document.addEventListener("click", function () {
        modelPanel.classList.remove("open");
        var pop = $("quickPop");
        if (pop) pop.classList.remove("open");
      });
      modelPanel.addEventListener("click", function (e) { e.stopPropagation(); });
      renderTabs();
      selectModel(currentModel);

      /* ── 模式切换 ── */
      $("switchMode").addEventListener("click", function (e) {
        var btn = e.target.closest("button[data-mode]");
        if (!btn) return;
        var btns = $("switchMode").querySelectorAll("button");
        for (var i = 0; i < btns.length; i++) btns[i].classList.remove("active");
        btn.classList.add("active");

        var mode = btn.getAttribute("data-mode");
        var ph = mode === "agent"
          ? "输入你的需求（如研究一个主题、制定旅行攻略、PPT等），生成图片、生成视频、生成可视化网页、APP、数据报告等。"
          : mode === "groups"
            ? "你可以选择多个模型同时提问，每个模型都有不同的特点和能力，你可以根据你的需求选择最适合的模型。"
            : "给 " + currentModel.label + " 发消息";
        input.placeholder = ph;
        input2.placeholder = mode === "default" ? "有问题，尽管问" : ph;
      });

      /* ── 工具按钮开关 ── */
      ["btnDeepThink", "btnInternet", "btnDeepThink2", "btnInternet2"].forEach(function (id) {
        var el = $(id);
        if (el) el.addEventListener("click", function () { el.classList.toggle("on"); });
      });

      $("bannerClose").addEventListener("click", function () {
        $("app").classList.add("banner-hidden");
      });
      $("btnShuffle").addEventListener("click", function () {
        promptOffset = (promptOffset + 4) % promptPool.length;
        renderPrompts();
      });

      /* ── 发送态 ── */
      function syncSend() {
        [input, input2].forEach(function (el) {
          var btn = el === input ? btnSend : btnSend2;
          var has = !!el.value.trim();
          btn.disabled = streaming ? false : !has;
          btn.classList.toggle("ready", streaming || has);
        });
      }
      function autoGrow(el) {
        el.style.height = "auto";
        el.style.height = Math.min(el.scrollHeight, 180) + "px";
      }
      input.addEventListener("input", function () { autoGrow(input); syncSend(); });
      input2.addEventListener("input", function () { autoGrow(input2); syncSend(); });

      function escapeHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/>/g, "&gt;").replace(/\n/g, "<br>");
      }

      function showChat() {
        welcomeBlock.style.display = "none";
        msgs.classList.add("show");
        $("composerDock").classList.add("show");
        $("btnNewChat").style.display = "";
      }

      function appendMsg(role, text) {
        showChat();
        var row = document.createElement("div");
        row.className = "msg " + role;
        var avatar = role === "user"
          ? '<div class="m-avatar"><i class="ri-user-3-line"></i></div>'
          : '<div class="m-avatar"><img src="' + LOGO + '" alt="" /></div>';
        row.innerHTML = avatar +
          '<div class="m-body"><div class="m-role">' +
          (role === "user" ? "你" : "极光AI · " + currentModel.label) +
          '</div><div class="m-content"></div></div>';
        row.querySelector(".m-content").textContent = text;
        msgs.appendChild(row);
        workspace.scrollTop = workspace.scrollHeight;
        return row.querySelector(".m-content");
      }

      function fakeStream(target, fullText) {
        streaming = true;
        syncSend();
        var i = 0;
        target.innerHTML = '<span class="cursor"></span>';
        streamTimer = setInterval(function () {
          i += Math.max(1, Math.floor(Math.random() * 3));
          target.innerHTML = escapeHtml(fullText.slice(0, i)) +
            (i < fullText.length ? '<span class="cursor"></span>' : "");
          workspace.scrollTop = workspace.scrollHeight;
          if (i >= fullText.length) {
            clearInterval(streamTimer);
            streamTimer = null;
            streaming = false;
            syncSend();
          }
        }, 28);
      }

      function stopStream() {
        if (streamTimer) {
          clearInterval(streamTimer);
          streamTimer = null;
        }
        streaming = false;
        var cs = document.querySelectorAll(".cursor");
        for (var i = 0; i < cs.length; i++) cs[i].remove();
        syncSend();
      }

      /* 当前可见的输入框：欢迎页用顶部，对话态用吸底 */
      function activeInput() {
        return msgs.classList.contains("show") ? input2 : input;
      }

      /* 示例提示词：写入输入框，不发起对话 */
      function fillInput(text) {
        var el = activeInput();
        el.value = text || "";
        autoGrow(el);
        syncSend();
        el.focus();
        /* 光标移到末尾，方便继续点图表类型追加 */
        try {
          var len = el.value.length;
          el.setSelectionRange(len, len);
        } catch (e) { /* ignore */ }
      }

      /* 图表类型：同类型文案替换（已有「使用××图表」则换掉，否则追加） */
      function appendInput(suffix) {
        if (!suffix) return;
        var el = activeInput();
        var base = el.value
          .replace(/(?:\s*)使用.+?图表/g, "")
          .replace(/\s+$/, "")
          .replace(/^\s+/, "");
        el.value = base ? (base + " " + suffix) : suffix;
        autoGrow(el);
        syncSend();
        el.focus();
        try {
          var len = el.value.length;
          el.setSelectionRange(len, len);
        } catch (e) { /* ignore */ }
      }

      function send(text, fromDock) {
        var el = fromDock ? input2 : input;
        var q = (text || el.value || "").trim();
        if (!q) return;
        if (streaming) { stopStream(); return; }
        el.value = "";
        autoGrow(el);
        syncSend();
        appendMsg("user", q);
        fakeStream(appendMsg("assistant", ""),
          "（静态还原演示）已收到：「" + q + "」\n\n" +
          "本页按 https://ai1foo.com/newchat 的真实结构与文案还原，包含左侧导航分组、" +
          "模型切换下拉、模型对话 / Agent模式 / 超级对话三档切换、" +
          "深度思考与联网搜索开关，以及示例提示词与 24 种图表类型。");
      }

      /* 快捷入口等：仍可用 data-q 直接发起对话 */
      function bindDataQ(root) {
        var nodes = (root || document).querySelectorAll("[data-q]");
        for (var i = 0; i < nodes.length; i++) {
          (function (btn) {
            btn.onclick = function () {
              var q = btn.getAttribute("data-q");
              if (q) send(q);
            };
          })(nodes[i]);
        }
      }
      bindDataQ();

      btnSend.addEventListener("click", function () { send(); });
      btnSend2.addEventListener("click", function () { send(null, true); });

      function onEnter(el, fromDock) {
        el.addEventListener("keydown", function (e) {
          if (e.key === "Enter" && !e.shiftKey) {
            e.preventDefault();
            send(null, fromDock);
          }
        });
      }
      onEnter(input, false);
      onEnter(input2, true);

      $("btnNewChat").addEventListener("click", function () {
        welcomeBlock.style.display = "";
        msgs.classList.remove("show");
        msgs.innerHTML = "";
        $("composerDock").classList.remove("show");
        input.value = "";
        autoGrow(input);
        syncSend();
        workspace.scrollTop = 0;
      });

      /* ── 侧栏折叠 / 移动端抽屉 ── */
      $("btnCollapseSider").addEventListener("click", function () {
        $("sider").classList.toggle("collapsed");
      });
      $("btnOpenSider").addEventListener("click", function () {
        $("sider").classList.add("open");
        $("mask").classList.add("show");
      });
      $("mask").addEventListener("click", function () {
        $("sider").classList.remove("open");
        $("mask").classList.remove("show");
      });

      document.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
          e.preventDefault();
          modelPanel.classList.add("open");
          $("modelSearch").focus();
        }
      });
    })();
  </script>
</body>
</html>
